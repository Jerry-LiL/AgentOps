services:
  agentops:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTOPS_LLM_MODE: local
      AGENTOPS_DATA_DIR: /data
      AGENTOPS_DB_PATH: /data/agentops.sqlite
      AGENTOPS_MAX_STEPS: "8"
    volumes:
      - agentops-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agentops-data:
