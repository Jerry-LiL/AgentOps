[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops"
version = "0.1.0"
description = "Planner/worker task runner that calls search, spreadsheet, and email-draft tools over MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vineet Kumar", email = "vineetahlawat12345@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langgraph>=1.0,<1.2",
    "mcp>=1.20,<2",
    "openai>=1.50",
    "jsonschema>=4.23",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[project.scripts]
agentops = "agentops.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agentops"]
